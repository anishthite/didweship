name: refresh-x-days

# Hourly refresh of apps/web/src/data/x-days-by-slug.json from the official
# X API v2 (pay-per-use). Iterates every user in apps/web/src/config/users.json
# and commits changed data back to main, which triggers a Vercel rebuild.
#
# Cadence: hourly. Billing is per-post-returned (~$0.005) and the script
# fetches via since_id (only tweets newer than the last seen ID), so quiet
# hours return 0 posts and cost ~$0. Estimated steady state: $1-3/mo.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-x-days
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN has contents: write per the top-level permissions
          # block above; that's enough to push back to the default branch
          # for repos without branch-protection rules requiring a PAT.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Manual reruns can start from the old triggering SHA; refresh from the
      # current branch tip so data generation uses the current file schema.
      - name: sync branch tip
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      # F6: SHA-pin third-party action so a moving major tag can't pull in
      # a malicious commit during a run that already has GITHUB_TOKEN and
      # X_BEARER_TOKEN in scope. The pinned SHA is pnpm/action-setup v3.0.0.
      # Version comes from package.json's "packageManager" field; do NOT
      # also pass `with: version:` here or pnpm/action-setup refuses both.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v3.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: refresh x-days
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Multi-user mode (D-030): the script reads the roster from
          # apps/web/src/config/users.json and refreshes one bundled file per
          # user (x-days-by-slug.json). Leave X_LOGIN UNSET so the legacy
          # single-user override path isn't taken.
          # Incremental via since_id: only posts newer than the stored
          # last_tweet_id are fetched (billed once per post, ever).
          # Originals only: retweets/replies don't count as shipping.
        run: pnpm tsx scripts/refresh-x-days.ts

      - name: commit if changed
        id: commit
        run: |
          # Multi-user: one slug-keyed data file changes. Use the directory-
          # level diff so a no-op across all users still cleanly skips.
          if git diff --quiet apps/web/src/data/; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use GitHub Actions' bot identity; the deploy hook below does not
          # depend on the commit author having Vercel access.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not autostash generated data across branch/schema changes: that
          # is how stale runs resurrect deleted x-days.*.json files as conflicts.
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch moved during refresh; rerun refresh-x-days on the latest branch tip."
            exit 1
          fi
          git add apps/web/src/data/
          git commit -m "data: refresh x-days $(date -u +%Y-%m-%d)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # F8: trigger Vercel via Deploy Hook rather than relying on a bot commit
      # author having access to the Vercel project. The hook URL is the auth.
      # Create one at:
      #   Vercel → Project → Settings → Git → Deploy Hooks → Create hook
      #   (branch: main, name: refresh-x-days-bot)
      # then store the URL as the `VERCEL_DEPLOY_HOOK_URL` repo secret.
      - name: trigger vercel deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set; skipping deploy trigger."
            echo "Set it in repo Settings → Secrets and variables → Actions."
            exit 0
          fi
          # Hook URL is project- and branch-scoped; no body needed. Use -f so
          # a non-2xx response fails the job (loud signal that the hook was
          # deleted/rotated). -sS keeps output quiet on success but shows
          # errors. We discard the JSON ack body and just print the status.
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" \
            -o /dev/null \
            -w "vercel deploy hook: HTTP %{http_code}\n"
